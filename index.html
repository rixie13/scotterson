<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>скоты</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2b102f 0%, #0d0410 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Сердце */
    .heart {
      position: relative;
      width: 220px;
      height: 220px;
      background: linear-gradient(45deg, #ff1e56, #ff5e7e);
      transform: rotate(-45deg);
      box-shadow: 0 0 60px rgba(255, 30, 86, 0.6);
      animation: heartbeat 1.4s infinite ease-in-out;
      z-index: 5;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: linear-gradient(45deg, #ff1e56, #ff5e7e);
      border-radius: 50%;
    }

    .heart::before {
      top: -110px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 110px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: rotate(-45deg) scale(1);
        box-shadow: 0 0 50px rgba(255, 30, 86, 0.5);
      }
      15% {
        transform: rotate(-45deg) scale(1.12);
        box-shadow: 0 0 80px rgba(255, 30, 86, 0.8);
      }
      30% {
        transform: rotate(-45deg) scale(1.03);
      }
      45% {
        transform: rotate(-45deg) scale(1.15);
        box-shadow: 0 0 90px rgba(255, 30, 86, 0.9);
      }
      70% {
        transform: rotate(-45deg) scale(1);
      }
    }

    /* Текст */
    .text-wrapper {
      position: absolute;
      z-index: 10;
      display: flex;
      gap: 4px;
      margin-top: -20px;
      pointer-events: none;
    }

    .letter {
      color: #ffffff;
      font-size: 36px;
      font-weight: 800;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(-250px) rotate(-15deg);
      animation: dropLetter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes dropLetter {
      0% {
        opacity: 0;
        transform: translateY(-250px) rotate(-15deg) scale(1.3);
      }
      70% {
        opacity: 1;
        transform: translateY(10px) rotate(4deg) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    .letter:nth-child(1) { animation-delay: 0.2s; }
    .letter:nth-child(2) { animation-delay: 0.35s; }
    .letter:nth-child(3) { animation-delay: 0.5s; }
    .letter:nth-child(4) { animation-delay: 0.65s; }
    .letter:nth-child(5) { animation-delay: 0.8s; }
    .letter:nth-child(6) { animation-delay: 0.95s; }
    .letter:nth-child(7) { animation-delay: 1.1s; }
    .letter:nth-child(8) { animation-delay: 1.25s; }
    .letter:nth-child(9) { animation-delay: 1.4s; }

    /* ===== Собачки ===== */

    .dog-group {
      position: absolute;
      top: calc(50% + 200px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 34px;
      z-index: 6;
    }

    .dog {
      position: relative;
      width: 74px;
      height: 78px;
      transform-origin: 50% 100%;
      animation: dance 1.4s ease-in-out infinite;
      cursor: crosshair;
      user-select: none;
    }

    .dog:nth-child(2) { animation-delay: 0.15s; }
    .dog:nth-child(3) { animation-delay: 0.3s; }

    .dog.hit {
      animation: hitBounce 0.6s ease-out;
    }

    .dog-body {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 58px;
      height: 44px;
      background: #e8b04b;
      border-radius: 55% 55% 48% 48% / 65% 65% 40% 40%;
    }

    .dog-body::after {
      content: "";
      position: absolute;
      top: 12px;
      right: 10px;
      width: 16px;
      height: 13px;
      background: #fff;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.85;
    }

    .dog-head {
      position: absolute;
      top: 4px;
      left: 2px;
      width: 38px;
      height: 34px;
      background: #e8b04b;
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      z-index: 2;
    }

    .dog-muzzle {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 14px;
      background: #f7ddad;
      border-radius: 45% 45% 55% 55%;
    }

    .dog-nose {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 6px;
      background: #3a2a1b;
      border-radius: 50% 50% 60% 60%;
    }

    .dog-eye {
      position: absolute;
      top: 11px;
      width: 5px;
      height: 7px;
      background: #2a1c10;
      border-radius: 50%;
    }
    .dog-eye.left { left: 7px; }
    .dog-eye.right { right: 7px; }
    .dog-eye::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
    }

    .dog-ear {
      position: absolute;
      top: 2px;
      width: 12px;
      height: 24px;
      background: #b97c28;
      border-radius: 50% 50% 60% 60% / 40% 40% 70% 70%;
      transform-origin: top center;
    }
    .dog-ear.left { left: -4px; transform: rotate(18deg); }
    .dog-ear.right { right: -4px; transform: rotate(-18deg); }

    .dog-leg {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 16px;
      background: #d99e35;
      border-radius: 5px 5px 4px 4px;
      transform-origin: top center;
    }
    .dog-leg.front-left { left: 14px; animation: step 0.7s ease-in-out infinite; }
    .dog-leg.front-right { right: 14px; animation: step 0.7s ease-in-out infinite 0.35s; }

    .dog-tail {
      position: absolute;
      bottom: 26px;
      right: -8px;
      width: 24px;
      height: 12px;
      background: #b97c28;
      border-radius: 12px 12px 4px 12px;
      transform-origin: left center;
      animation: wag 0.35s ease-in-out infinite alternate;
    }

    @keyframes dance {
      0%, 100% { transform: translateY(0) rotate(-7deg); }
      25%      { transform: translateY(-14px) rotate(0deg); }
      50%      { transform: translateY(0) rotate(7deg); }
      75%      { transform: translateY(-10px) rotate(0deg); }
    }

    @keyframes step {
      0%, 100% { transform: rotate(-14deg); }
      50%      { transform: rotate(14deg); }
    }

    @keyframes wag {
      from { transform: rotate(-24deg); }
      to   { transform: rotate(24deg); }
    }

    /* ===== Мини-игра ===== */

    @keyframes hitBounce {
      0%   { transform: scale(1, 1) translateY(0); }
      30%  { transform: scale(1.25, 0.55) translateY(6px); }
      60%  { transform: scale(0.9, 1.2) translateY(-26px); }
      85%  { transform: scale(1.05, 0.95) translateY(2px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    /* ===== Записка ===== */

    .note {
      position: fixed;
      z-index: 100;
      max-width: 220px;
      padding: 14px 18px 12px;
      background: #fffbe8;
      color: #4a3b20;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      white-space: normal;
      transform: translate(-50%, 0) rotate(var(--tilt));
      animation: noteFly 2.4s ease-out forwards;
    }

    /* «Скрепка» сверху записки */
    .note::before {
      content: "📌";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
    }

    /* Лёгкая «линейка» на бумаге */
    .note::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 30px;
      height: 1px;
      background: rgba(180, 150, 90, 0.25);
    }

    @keyframes noteFly {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) scale(0.6) rotate(var(--tilt));
      }
      12% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1) rotate(var(--tilt));
      }
      20% {
        transform: translate(-50%, -8px) scale(1) rotate(calc(var(--tilt) * -1));
      }
      30% {
        transform: translate(-50%, -20px) scale(1) rotate(var(--tilt));
      }
      45% {
        transform: translate(-50%, -50px) scale(1) rotate(calc(var(--tilt) * -1));
      }
      60% {
        transform: translate(-50%, -80px) scale(1) rotate(var(--tilt));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -170px) scale(1) rotate(var(--tilt));
      }
    }

    /* Вспышка при попадании */
    .spark {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      z-index: 99;
      pointer-events: none;
      animation: spark 0.5s ease-out forwards;
    }

    @keyframes spark {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(3.2); }
    }

    /* Счёт */
    .score {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 50;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div class="score">Комплиментов: <span id="scoreNum">0</span></div>

  <div class="scene">
    <div class="heart"></div>

    <div class="text-wrapper">
      <span class="letter">С</span>
      <span class="letter">К</span>
      <span class="letter">О</span>
      <span class="letter">Т</span>
      <span class="letter">Т</span>
      <span class="letter">Е</span>
      <span class="letter">Р</span>
      <span class="letter">С</span>
      <span class="letter">О</span>
      <span class="letter">Н</span>
    </div>
  </div>

  <div class="dog-group">
    <!-- Собачка 1 -->
    <div class="dog">
      <div class="dog-body"></div>
      <div class="dog-head">
        <div class="dog-ear left"></div>
        <div class="dog-ear right"></div>
        <div class="dog-eye left"></div>
        <div class="dog-eye right"></div>
        <div class="dog-muzzle">
          <div class="dog-nose"></div>
        </div>
      </div>
      <div class="dog-leg front-left"></div>
      <div class="dog-leg front-right"></div>
      <div class="dog-tail"></div>
    </div>

    <!-- Собачка 2 -->
    <div class="dog">
      <div class="dog-body"></div>
      <div class="dog-head">
        <div class="dog-ear left"></div>
        <div class="dog-ear right"></div>
        <div class="dog-eye left"></div>
        <div class="dog-eye right"></div>
        <div class="dog-muzzle">
          <div class="dog-nose"></div>
        </div>
      </div>
      <div class="dog-leg front-left"></div>
      <div class="dog-leg front-right"></div>
      <div class="dog-tail"></div>
    </div>

    <!-- Собачка 3 -->
    <div class="dog">
      <div class="dog-body"></div>
      <div class="dog-head">
        <div class="dog-ear left"></div>
        <div class="dog-ear right"></div>
        <div class="dog-eye left"></div>
        <div class="dog-eye right"></div>
        <div class="dog-muzzle">
          <div class="dog-nose"></div>
        </div>
      </div>
      <div class="dog-leg front-left"></div>
      <div class="dog-leg front-right"></div>
      <div class="dog-tail"></div>
    </div>
  </div>

<script>
  // ===== Душевные фразы =====
  const phrases = [
    'Спасибо, что ты есть.',
    'Ты нужен этому миру. По-настоящему.',
    'Я так рада, что ты родился.',
    'Ты не один. Никогда.',
    'Мир стал добрее, потому что ты в нём живёшь.',
    'Ты справишься. Я в тебя верю.',
    'Кто-то сегодня улыбнулся из-за тебя.',
    'Ты делаешь чью-то жизнь лучше — просто бывая в ней.',
    'Обнимаю крепко-крепко. Как в детстве.',
    'Ты заслуживаешь добра. Просто так.',
    'Помни: у тебя всё получится. Даже если сейчас не верится.',
    'Ты — чей-то тёплый свет в холодный вечер.',
    'Спасибо, что не сдаёшься.',
    'Ты был нужен всегда. И сейчас тоже.',
    'Пусть у тебя болит душа, но ты всё равно прекрасен.',
    'Я горжусь тобой. Серьёзно.',
    'Ты прощаешь других — теперь прости и себя.',
    'Однажды ты поймёшь, что всё это было не зря.',
    'Ты не никому не нужный. Ты — самый нужный.',
    'Держись. После этой ночи обязательно будет рассвет.'
  ];

  // Конструктор тёплых фраз: «Ты самый/самая + ...»
  const warmStarts = ['Ты самый', 'Ты самая', 'Ты — самый', 'Ты — самая'];
  const warmEnds = [
    'родной человек на свете',
    'тёплый луч в моей жизни',
    'настоящий, живой, настоящий',
    'смелый из тех, кого я знаю',
    'хрупкий и сильный одновременно',
    'важный человек для кого-то',
    'тот, кто умеет любить',
    'добрый в этом жестоком мире'
  ];

  const random = arr => arr[Math.floor(Math.random() * arr.length)];

  let lastPhrase = '';
  function makePhrase() {
    let p;
    do {
      p = Math.random() < 0.35
        ? random(warmStarts) + ' ' + random(warmEnds) + '.'
        : random(phrases);
    } while (p === lastPhrase);
    lastPhrase = p;
    return p;
  }

  const scoreEl = document.getElementById('scoreNum');
  let score = 0;

  // ===== Стрельба по собаке =====
  document.querySelectorAll('.dog').forEach(dog => {
    dog.addEventListener('click', e => {
      // Собака сплющивается и возвращается
      dog.classList.remove('hit');
      void dog.offsetWidth;
      dog.classList.add('hit');
      dog.addEventListener('animationend', () => dog.classList.remove('hit'), { once: true });

      // Вспышка в точке клика
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = e.clientX - 5 + 'px';
      spark.style.top = e.clientY - 5 + 'px';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 500);

      // Одна записка с душевной фразой
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = makePhrase();
      note.style.setProperty('--tilt', (Math.random() * 12 - 6).toFixed(1) + 'deg');
      note.style.left = e.clientX + 'px';
      note.style.top = (e.clientY - 10) + 'px';

      document.body.appendChild(note);
      setTimeout(() => note.remove(), 2500);

      // Счётчик
      score++;
      scoreEl.textContent = score;
    });
  });
</script>


</body>
</html>
